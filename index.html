<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume & Portfolio</title>
  
  <!-- Markdown Parser & GitHub Markdown CSS -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css" />

  <style>
    body {
      background-color: #f3f4f6;
      margin: 0;
      padding: 40px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }

    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 45px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
    }

    /* Style external badges & links */
    .markdown-body img {
      display: inline-block;
      margin-right: 6px;
      margin-top: 6px;
    }

    @media (max-width: 767px) {
      body { padding: 16px 8px; }
      .markdown-body { padding: 24px; }
    }
  </style>
</head>
<body>

  <article id="content" class="markdown-body">
    <p>Loading resume...</p>
  </article>

  <script>
    // Fetch and render resume.md
    fetch('resume.md')
      .then(response => {
        if (!response.ok) {
          throw new Error('Could not load resume.md file.');
        }
        return response.text();
      })
      .then(markdownText => {
        document.getElementById('content').innerHTML = marked.parse(markdownText);
      })
      .catch(error => {
        document.getElementById('content').innerHTML = `
          <h2>⚠️ Unable to load content</h2>
          <p>Make sure you have a <code>resume.md</code> file committed in your repository root.</p>
        `;
        console.error(error);
      });
  </script>
</body>
</html>
