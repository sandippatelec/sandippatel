<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio & Resume</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Marked Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --accent: #06b6d4;
      --bg-dark: #0b0f19;
      --surface: #111827;
      --surface-card: #1f2937;
      --surface-hover: #283548;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
      --gradient-accent: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Container */
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    /* Hero Section */
    .hero-card {
      background: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
                  var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
    }

    .hero-header {
      display: flex;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
    }

    .hero-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid var(--primary-light);
      object-fit: cover;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
    }

    .hero-info h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .hero-info .role-title {
      font-size: 1.25rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .hero-bio {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 680px;
      margin-top: 14px;
    }

    /* Action Buttons */
    .cta-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .cta-phone-number {
      display: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      align-self: center;
    }

    .cta-primary {
      background: var(--gradient-accent);
      color: #ffffff;
      box-shadow: 0 8px 20px -6px rgba(79, 70, 229, 0.6);
    }
    .cta-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -6px rgba(79, 70, 229, 0.8);
    }

    .cta-secondary {
      background: var(--surface-card);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .cta-secondary:hover {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* Sections */
    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      margin: 32px 0 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title i {
      color: var(--primary-light);
      font-size: 1.25rem;
    }

    /* Timeline / Experience Cards */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .timeline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 28px;
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .timeline-card:hover {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.3);
      background: var(--surface-hover);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }

    .job-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
    }

    .company-name {
      color: var(--accent);
      font-weight: 600;
    }

    .time-badge {
      font-size: 0.82rem;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .timeline-card ul {
      margin-top: 12px;
      padding-left: 20px;
      color: var(--text-muted);
    }
    .timeline-card li { margin-bottom: 6px; }

    /* Skills Pill Grid */
    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .skill-pill {
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: #e2e8f0;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .skill-pill:hover {
      background: var(--primary);
      color: #ffffff;
      transform: translateY(-2px);
      border-color: var(--primary-light);
    }

    /* Project Cards */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .project-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .project-card h3 a {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.15rem;
    }
    .project-card p {
      color: var(--text-muted);
      margin: 10px 0 16px;
      font-size: 0.95rem;
    }

    @media (max-width: 680px) {
      .hero-card { padding: 24px; }
      .hero-header { flex-direction: column; align-items: flex-start; gap: 16px; }
      .hero-avatar { width: 90px; height: 90px; }
      .hero-info h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <p style="text-align:center; padding: 40px; color: var(--text-muted);">Loading visual portfolio...</p>
  </div>

  <script>
    fetch('resume.md')
      .then(res => {
        if (!res.ok) throw new Error('Cannot load resume.md');
        return res.text();
      })
      .then(mdText => {
        renderCustomResume(mdText);
      })
      .catch(err => {
        document.getElementById('app').innerHTML = `
          <div style="background: var(--surface); padding: 32px; border-radius: 16px; border: 1px solid var(--border); text-align: center;">
            <h2 style="color: #ef4444; margin-bottom: 8px;">⚠️ resume.md not found</h2>
            <p style="color: var(--text-muted);">Ensure <code>resume.md</code> is in your repository root alongside <code>index.html</code>.</p>
          </div>
        `;
      });

    function renderCustomResume(markdown) {
      // Create off-screen container for standard markdown parsing
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = marked.parse(markdown);

      const app = document.getElementById('app');
      app.innerHTML = '';

      // 1. EXTRACT HERO SECTION
      const h1 = tempDiv.querySelector('h1');
      const h3 = tempDiv.querySelector('h3');
      const img = tempDiv.querySelector('img');
      const firstUl = tempDiv.querySelector('ul');

      // Create Hero Banner
      const hero = document.createElement('div');
      hero.className = 'hero-card';
      
      const avatarSrc = img ? img.src : 'https://api.dicebear.com/7.x/bottts/svg?seed=portfolio';
      const name = h1 ? h1.innerText : 'Your Name';
      const role = h3 ? h3.innerText : 'Developer';
      
      // Only use a paragraph between the name/role and the first section heading
      // for the banner, so section content (such as About Me) stays in its section.
      let introText = '';
      let current = h3 ? h3.nextElementSibling : null;
      while (current && !/^H[1-6]$/.test(current.tagName)) {
        if (current.tagName === 'P' && !current.querySelector('img, a') && current.innerText.trim().length > 20) {
          introText = current.innerText.trim();
          break;
        }
        current = current.nextElementSibling;
      }

      // Collect links from the top
      let linksHtml = '';
      const topLinks = Array.from(tempDiv.querySelectorAll('a'));
      const socialLinks = topLinks.slice(0, 4); // First few action buttons

      socialLinks.forEach(link => {
        const label = (link.innerText.trim() || link.querySelector('img')?.alt || link.title || 'Open link').trim();
        const text = label.toLowerCase();
        let icon = 'fa-arrow-up-right-from-square';
        let isPrimary = false;

        if (text.includes('linkedin')) icon = 'fa-brands fa-linkedin';
        else if (text.includes('github')) icon = 'fa-brands fa-github';
        else if (text.includes('resume') || text.includes('pdf') || text.includes('cv')) {
          icon = 'fa-file-pdf';
          isPrimary = true;
        } else if (link.href.startsWith('tel:')) icon = 'fa-phone';
        else if (text.includes('mail') || text.includes('contact')) icon = 'fa-envelope';

        const target = link.href.startsWith('tel:') ? '' : ' target="_blank"';
        const phoneNumber = link.href.startsWith('tel:') ? decodeURIComponent(link.href.slice(4)) : '';

        linksHtml += `
          <a href="${phoneNumber ? '#' : link.href}"${target} class="cta-btn ${isPrimary ? 'cta-primary' : 'cta-secondary'}"${phoneNumber ? ` data-phone="${phoneNumber}"` : ''}>
            <i class="fa-solid ${icon}"></i> ${label}
          </a>
          ${phoneNumber ? `<span class="cta-phone-number">${phoneNumber}</span>` : ''}
        `;
      });

      hero.innerHTML = `
        <div class="hero-header">
          <img src="${avatarSrc}" alt="${name}" class="hero-avatar" />
          <div class="hero-info">
            <h1>${name}</h1>
            <div class="role-title">${role}</div>
            ${introText ? `<p class="hero-bio">${introText}</p>` : ''}
            <div class="cta-container">${linksHtml}</div>
          </div>
        </div>
      `;
      app.appendChild(hero);

      app.querySelectorAll('.cta-btn[data-phone]').forEach(button => {
        button.addEventListener('click', event => {
          event.preventDefault();
          const number = button.nextElementSibling;
          number.style.display = number.style.display === 'inline' ? 'none' : 'inline';
        });
      });

      // 2. PARSE SECTIONS (Experience, Projects, Skills)
      const h2Elements = Array.from(tempDiv.querySelectorAll('h2'));

      h2Elements.forEach(h2 => {
        const title = h2.innerText;
        const sectionContainer = document.createElement('div');
        
        let icon = 'fa-circle-dot';
        if (title.toLowerCase().includes('experience')) icon = 'fa-briefcase';
        else if (title.toLowerCase().includes('project')) icon = 'fa-laptop-code';
        else if (title.toLowerCase().includes('skill')) icon = 'fa-bolt';
        else if (title.toLowerCase().includes('education')) icon = 'fa-graduation-cap';

        sectionContainer.innerHTML = `
          <h2 class="section-title"><i class="fa-solid ${icon}"></i> ${title}</h2>
        `;

        // Gather siblings until next H2
        let current = h2.nextElementSibling;
        const siblings = [];
        while (current && current.tagName !== 'H2') {
          siblings.push(current);
          current = current.nextElementSibling;
        }

        // Render Experience / Education
        if (title.toLowerCase().includes('experience') || title.toLowerCase().includes('education')) {
          const timeline = document.createElement('div');
          timeline.className = 'timeline';

          for (let i = 0; i < siblings.length; i++) {
            const el = siblings[i];
            if (el.tagName === 'H3') {
              const card = document.createElement('div');
              card.className = 'timeline-card';
              
              const codeBadge = siblings[i+1] && siblings[i+1].tagName === 'P' && siblings[i+1].querySelector('code') 
                ? siblings[i+1].querySelector('code').innerText : '';
              
              const ulContent = siblings.find((s, idx) => idx > i && s.tagName === 'UL');

              card.innerHTML = `
                <div class="card-top">
                  <div class="job-title">${el.innerHTML}</div>
                  ${codeBadge ? `<span class="time-badge">${codeBadge}</span>` : ''}
                </div>
                ${ulContent ? ulContent.outerHTML : ''}
              `;
              timeline.appendChild(card);
            }
          }
          sectionContainer.appendChild(timeline);
        }

        // Render Skills
        else if (title.toLowerCase().includes('skill')) {
          const skillsGrid = document.createElement('div');
          skillsGrid.className = 'skills-grid';
          
          siblings.forEach(el => {
            if (el.tagName === 'UL') {
              el.querySelectorAll('li').forEach(li => {
                // If formatted like "Category: item1, item2"
                const parts = li.innerText.split(':');
                if (parts.length > 1) {
                  const items = parts[1].split(',');
                  items.forEach(item => {
                    const pill = document.createElement('span');
                    pill.className = 'skill-pill';
                    pill.textContent = item.trim();
                    if (pill.textContent) skillsGrid.appendChild(pill);
                  });
                } else {
                  const pill = document.createElement('span');
                  pill.className = 'skill-pill';
                  pill.textContent = li.innerText.trim();
                  if (pill.textContent) skillsGrid.appendChild(pill);
                }
              });
            }
          });
          sectionContainer.appendChild(skillsGrid);
        } else {
          siblings.forEach(el => {
            // Markdown horizontal rules (---) add an unwanted line and gap between sections.
            if (el.tagName !== 'HR') sectionContainer.appendChild(el.cloneNode(true));
          });
        }

        app.appendChild(sectionContainer);
      });
    }
  </script>
</body>
</html>
